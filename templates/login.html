{% extends "base.html" %}
{% block c %}
<div style="max-width: 400px; margin: 40px auto 0;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Iniciar sesión</h2>
      <span class="card-subtitle">Accede a tu panel personal</span>
    </div>

    {% if err %}
    <div class="alert-message error">
      {{ err }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div style="display: grid; gap: 14px;">
        <label>
          <span>Correo electrónico</span>
          <input name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required autofocus>
        </label>
        <label>
          <span>Contraseña</span>
          <input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); user-select: none; margin-top: 2px;">
          <input type="checkbox" name="recordar" value="1" checked>
          <span>Mantener la sesión iniciada</span>
        </label>
        <button class="primary" style="width: 100%; padding: 9px; margin-top: 4px;">Iniciar sesión</button>
      </div>
    </form>

    <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-divider); font-size: 12.5px; text-align: center; color: var(--text-muted);">
      ¿No tienes una cuenta? <a href="{{ url_for('registro') }}" style="color: var(--text-primary); font-weight: 600; text-decoration: none;">Crear cuenta</a>
    </div>
  </div>
</div>
{% endblock %}
